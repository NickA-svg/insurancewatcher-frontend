# Rebuilds the Cloudflare Pages site every 3 hours so the pre-rendered news, line-of-business and
# Cat Monitor pages stay fresh for search engines (the live app always shows the latest data).
# Setup: Cloudflare Pages > Settings > Builds > Deploy hooks > create one, then add it to this repo as
# the secret CF_PAGES_DEPLOY_HOOK (GitHub > Settings > Secrets and variables > Actions).
name: Scheduled rebuild
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        run: curl -fsS -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK }}"
